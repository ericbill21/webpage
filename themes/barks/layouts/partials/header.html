
<header>
    {{ $logo := .Site.Params.header.logo }}
    {{ $logoAlt := default .Site.Title .Site.Params.header.logo_alt }}
    {{ if $logo }}
        <a href="/" class="title" aria-label="{{ $logoAlt }}">
            <img src="{{ $logo | relURL }}" alt="{{ $logoAlt }}" class="site-logo">
        </a>
    {{ else }}
        <a href="/" class="title">{{ .Site.Title | safeHTML }}</a>
    {{ end }}   
</header>
